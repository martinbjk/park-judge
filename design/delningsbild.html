<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<!--
  Ritningen till delningsbilden (app/opengraph-image.png).
  Så gör du en ny bild: öppna filen i Chrome med fönstret 1200 × 630 pixlar,
  ta en skärmbild av hela sidan och spara den som app/opengraph-image.png
  och app/twitter-image.png.
-->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #07090d; }
  .kort {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background:
      radial-gradient(700px 420px at 92% 8%, rgba(245,184,46,0.20), transparent 60%),
      radial-gradient(600px 400px at -5% 110%, rgba(77,163,255,0.12), transparent 60%),
      #07090d;
    color: #e9eef5; font-family: "Inter", sans-serif;
  }
  .text { position: absolute; left: 72px; top: 70px; width: 600px; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 34px; }
  .logo {
    width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center;
    background: linear-gradient(135deg, #f5b82e, #ff8a3d); color: #111;
    font-family: "Barlow Condensed"; font-weight: 800; font-size: 36px;
  }
  .brand span { font-family: "Barlow Condensed"; font-weight: 700; font-size: 26px; letter-spacing: 0.14em; text-transform: uppercase; color: #8794a6; }
  h1 {
    font-family: "Barlow Condensed"; font-weight: 800; text-transform: uppercase;
    font-size: 132px; line-height: 0.86; letter-spacing: 0.01em;
  }
  h1 em { font-style: normal; color: #f5b82e; display: block; }
  .rad { margin-top: 26px; font-size: 27px; font-weight: 500; color: #c9d2de; line-height: 1.35; }
  .chips { position: absolute; left: 72px; bottom: 62px; display: flex; gap: 12px; }
  .chip {
    border: 1.5px solid #2a3442; background: rgba(20,26,34,0.85); border-radius: 999px;
    padding: 9px 18px; font-size: 19px; font-weight: 600; color: #e9eef5; white-space: nowrap;
  }
  .chip b { color: #f5b82e; }
  .figur { position: absolute; right: 0; top: 0; width: 560px; height: 630px; }
</style>
</head>
<body>
<div class="kort">
  <div class="text">
    <div class="brand"><div class="logo">PJ</div><span>AI-domare · Park skateboarding</span></div>
    <h1>Park<em>Judge</em></h1>
    <p class="rad">Bygg runnen som domarna vill se – bedömd enligt OS-kriterierna.</p>
  </div>
  <div class="chips">
    <span class="chip"><b>7</b> OS-kriterier</span>
    <span class="chip">Kreativa trick</span>
    <span class="chip">Svenska · English</span>
  </div>

  <svg class="figur" viewBox="0 0 560 630" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffc94a"/><stop offset="1" stop-color="#f0a21f"/>
      </linearGradient>
      <linearGradient id="ramp" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#222c39"/><stop offset="1" stop-color="#121821"/>
      </linearGradient>
      <filter id="skugga" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
      </filter>
    </defs>

    <!-- quarterpipe i bakgrunden -->
    <path d="M 0 630 L 0 560 Q 300 560 420 380 Q 470 300 480 200 L 560 200 L 560 630 Z" fill="url(#ramp)"/>
    <path d="M 0 560 Q 300 560 420 380 Q 470 300 480 200" fill="none" stroke="#45536a" stroke-width="4"/>
    <rect x="474" y="190" width="86" height="12" rx="6" fill="#9aa6b6"/>

    <g transform="translate(-24 10)">
    <!-- domaren -->
    <g filter="url(#skugga)">
      <!-- kropp / hoodie -->
      <path d="M 150 630 L 160 470 Q 170 420 230 405 L 330 405 Q 390 420 400 470 L 410 630 Z" fill="url(#hoodie)"/>
      <!-- luva bakom nacken -->
      <path d="M 220 410 Q 280 445 340 410 Q 330 390 280 388 Q 230 390 220 410 Z" fill="#d98f14"/>
      <!-- snören -->
      <path d="M 262 420 L 258 470" stroke="#fff3d6" stroke-width="4" stroke-linecap="round"/>
      <path d="M 298 420 L 302 470" stroke="#fff3d6" stroke-width="4" stroke-linecap="round"/>
      <!-- magficka -->
      <path d="M 215 540 L 345 540 L 360 600 L 200 600 Z" fill="#e8981a" opacity="0.9"/>

      <!-- vänster arm (bildens vänster) med clipboard -->
      <path d="M 168 470 Q 120 520 150 585" stroke="url(#hoodie)" stroke-width="54" stroke-linecap="round" fill="none"/>
      <g transform="rotate(-8 175 560)">
        <rect x="128" y="500" width="100" height="128" rx="8" fill="#7a4e1f"/>
        <rect x="138" y="516" width="80" height="104" rx="3" fill="#f4f6f9"/>
        <rect x="160" y="494" width="36" height="16" rx="4" fill="#9aa6b6"/>
        <line x1="148" y1="538" x2="206" y2="538" stroke="#b9c3d0" stroke-width="4"/>
        <line x1="148" y1="554" x2="200" y2="554" stroke="#b9c3d0" stroke-width="4"/>
        <line x1="148" y1="570" x2="206" y2="570" stroke="#b9c3d0" stroke-width="4"/>
        <path d="M 148 590 l 8 8 l 14 -16" stroke="#35d07f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <circle cx="152" cy="584" r="20" fill="#e3a77c"/>

      <!-- höger arm upp mot kortet -->
      <path d="M 385 460 Q 440 400 448 300" stroke="url(#hoodie)" stroke-width="54" stroke-linecap="round" fill="none"/>
      <path d="M 450 318 L 446 290" stroke="#e8981a" stroke-width="56" stroke-linecap="butt"/>

      <!-- band med domarbricka -->
      <path d="M 246 412 L 262 486 M 314 412 L 298 486" stroke="#4da3ff" stroke-width="6" stroke-linecap="round"/>
      <rect x="248" y="480" width="64" height="44" rx="6" fill="#ffffff"/>
      <rect x="248" y="480" width="64" height="13" rx="6" fill="#4da3ff"/>
      <text x="280" y="514" text-anchor="middle" font-family="Barlow Condensed" font-weight="800" font-size="17" fill="#111" letter-spacing="1">JUDGE</text>

      <!-- hals och huvud -->
      <rect x="258" y="368" width="44" height="44" rx="12" fill="#d8996c"/>
      <ellipse cx="280" cy="300" rx="78" ry="84" fill="#e3a77c"/>
      <!-- öron -->
      <ellipse cx="203" cy="306" rx="13" ry="20" fill="#d8996c"/>
      <ellipse cx="357" cy="306" rx="13" ry="20" fill="#d8996c"/>
      <!-- keps bakochfram -->
      <path d="M 200 278 Q 202 200 280 196 Q 358 200 360 278 Q 330 262 280 262 Q 230 262 200 278 Z" fill="#151a22"/>
      <path d="M 200 270 Q 165 266 150 284 Q 176 292 206 284 Z" fill="#151a22"/>
      <rect x="262" y="200" width="36" height="9" rx="4" fill="#f5b82e"/>
      <path d="M 210 262 Q 280 246 350 262" stroke="#f5b82e" stroke-width="5" fill="none"/>
      <!-- ögonbryn -->
      <path d="M 232 286 Q 248 276 262 284" stroke="#3a2a1e" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M 298 284 Q 312 276 328 286" stroke="#3a2a1e" stroke-width="6" fill="none" stroke-linecap="round"/>
      <!-- ögon (ena blinkar) -->
      <ellipse cx="248" cy="306" rx="8" ry="10" fill="#1d1712"/>
      <circle cx="251" cy="302" r="3" fill="#fff"/>
      <path d="M 302 307 Q 313 298 324 307" stroke="#1d1712" stroke-width="6" fill="none" stroke-linecap="round"/>
      <!-- näsa -->
      <path d="M 280 312 Q 288 330 276 336" stroke="#c4825a" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- leende -->
      <path d="M 244 346 Q 280 382 318 344 Q 280 362 244 346 Z" fill="#7a2e22"/>
      <path d="M 252 350 Q 280 362 310 349 L 306 356 Q 280 366 256 357 Z" fill="#fff"/>
      <!-- kinder -->
      <ellipse cx="226" cy="334" rx="13" ry="8" fill="#e98a74" opacity="0.55"/>
      <ellipse cx="336" cy="334" rx="13" ry="8" fill="#e98a74" opacity="0.55"/>
      <!-- visselpipa på bröstet -->
      <circle cx="324" cy="458" r="9" fill="#9aa6b6"/>
      <path d="M 314 412 Q 330 432 324 450" stroke="#9aa6b6" stroke-width="3" fill="none"/>
    </g>

    <!-- scorekort i handen -->
    <g transform="rotate(8 448 170)" filter="url(#skugga)">
      <rect x="352" y="64" width="196" height="150" rx="14" fill="#ffffff"/>
      <rect x="352" y="64" width="196" height="150" rx="14" fill="none" stroke="#111" stroke-width="5"/>
      <rect x="352" y="64" width="196" height="30" rx="14" fill="#f5b82e"/>
      <rect x="352" y="80" width="196" height="14" fill="#f5b82e"/>
      <text x="450" y="87" text-anchor="middle" font-family="Barlow Condensed" font-weight="800" font-size="20" fill="#111" letter-spacing="3">SCORE</text>
      <text x="450" y="196" text-anchor="middle" font-family="Barlow Condensed" font-weight="800" font-size="104" fill="#111">9.6</text>
      <rect x="430" y="210" width="40" height="50" rx="8" fill="#ffffff" stroke="#111" stroke-width="4"/>
    </g>
    <!-- hand som håller kortet -->
    <circle cx="447" cy="262" r="24" fill="#e3a77c"/>
    <path d="M 430 252 Q 447 244 464 252" stroke="#c4825a" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- rörelselinjer och gnistor runt kortet -->
    <g stroke="#f5b82e" stroke-width="7" stroke-linecap="round">
      <line x1="320" y1="96" x2="296" y2="86"/>
      <line x1="314" y1="130" x2="286" y2="130"/>
      <line x1="322" y1="164" x2="298" y2="174"/>
    </g>
    <g fill="#f5b82e">
      <path d="M 530 40 l 6 16 l 16 6 l -16 6 l -6 16 l -6 -16 l -16 -6 l 16 -6 Z"/>
      <path d="M 340 30 l 4 10 l 10 4 l -10 4 l -4 10 l -4 -10 l -10 -4 l 10 -4 Z" opacity="0.8"/>
    </g>
    </g>
  </svg>
</div>
</body>
</html>
